name: Check Python

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: dev-requirements.txt
      - name: Cache development dependencies
        run: python -m pip install -r dev-requirements.txt

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}  # deep clone for setuptools-scm
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: dev-requirements.txt
      - name: Install development dependencies
        run: python -m pip install -r dev-requirements.txt
      - name: Check package builds
        run: python -m tox -e build

  test:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: dev-requirements.txt
      - name: Install development dependencies
        run: python -m pip install -r dev-requirements.txt
      - name: Run tests
        run: python -m tox --develop

  lint:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: dev-requirements.txt
      - name: Install development dependencies
        run: python -m pip install -r dev-requirements.txt
      - name: Run lint
        run: python -m tox -e lint --develop

  typecheck:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: dev-requirements.txt
      - name: Install development dependencies
        run: python -m pip install -r dev-requirements.txt
      - name: Run typecheck
        run: python -m tox -e typecheck --develop
